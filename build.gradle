plugins {
    id 'fabric-loom' version '1.7.4'
}

version = mod_version
group = 'first.carbon'
base.archivesName = 'carbon'

java {
    // 本机只有 Java 17 工具链；编译 release 16 以兼容 MC 1.17.1 的 Java 16 运行时。
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 16
}

loom {
    mixin {
        defaultRefmapName = 'carbon.refmap.json'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:2.0.17"
    modCompileOnly "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
    annotationProcessor "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.3.5'))
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
tasks.withType(Jar).configureEach { from 'LICENSE' }
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'carbon.mixins.json')
}
